name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MetaTrader5 solo existe en Windows: requirements.txt lo salta en Linux
      # y las pruebas no lo necesitan (tampoco Telegram ni la IA).
      - run: pip install -r requirements.txt
      - run: python pruebas.py
